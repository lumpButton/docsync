# A sample project the tests run docsync against: the ruff setup docsync is meant for.
[project]
name = "sample"
version = "0"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["D"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["property"]
