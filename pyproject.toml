[project]
name = "docsync"
version = "0.2.1"
description = "Keep Google-style Python docstrings in sync with the code: templates, updates and a placeholder check next to ruff."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lumpButton" }]
requires-python = ">=3.12"
keywords = ["docstrings", "google-style", "ruff", "pydoclint", "fastapi", "linter", "formatter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# ruff decides where a docstring is required; docsync runs it from the same environment.
dependencies = ["ruff>=0.9"]

[project.urls]
Repository = "https://github.com/lumpButton/docsync"
Issues = "https://github.com/lumpButton/docsync/issues"

[project.scripts]
docsync = "docsync.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.13", "pydoclint>=0.6", "pytest>=8.3"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT", "RUF",
    "ANN", "ARG", "BLE", "C90", "ERA", "FBT", "FURB", "PERF", "PGH", "PIE", "PL", "PTH",
    "RSE", "S", "SLF", "T10", "T20", "TID", "TRY",
    "D",
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
]
ignore = [
    "TRY003", # long messages in exception constructors
    "D100",   # module docstrings
    "D104",   # package docstrings
    "D105",   # magic methods
    "D107",   # __init__ is documented on the class
    "D301",   # docstrings may contain "\f" for FastAPI
]
# Enables only the preview rules listed by full code above (DOC*).
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001", "D", "DOC", "FBT001"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["property"]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pydoclint]
style = "google"
exclude = "tests"
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-return-types = true
check-yield-types = true
check-arg-order = true
skip-checking-short-docstrings = true
skip-checking-raises = true
check-class-attributes = true
treat-property-methods-as-class-attributes = true
allow-init-docstring = false

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
